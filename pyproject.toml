[build-system]
# >= 77 because of PEP 639: the `license = "MIT"` expression and
# `license-files` below are only understood from that version. An older
# setuptools reads `license` as free text instead and quietly emits
# legacy metadata — the build succeeds, and the wheel is wrong.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kaypy"
version = "0.13.2"
description = "A real-Python game engine with KAPLAY's component API, backed by pygame-ce, exporting to the browser."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stephen Franz" }]
keywords = ["game", "gamedev", "game-engine", "kaplay", "pygame", "education", "teaching", "wasm"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: pygame",
    "Operating System :: OS Independent",
]

dependencies = [
    # Pinned exact, not a floating >=, on purpose — see DEVELOPING.md, "Why
    # pygame-ce is pinned, not vendored". Bump deliberately, re-run tests/
    # and examples/, then move the pin.
    "pygame-ce==2.5.8",
]

# No optional dependencies. `kaypy web` used to need two — pygbag to build
# the page and ffmpeg (or imageio-ffmpeg) to convert every .wav to .ogg,
# because pygbag's build step rejects .wav outright. It now writes the page
# itself and carries the .wav unchanged, so `pip install kaypy` is the whole
# install and a student with no ffmpeg is not a student who cannot publish.

[project.urls]
Homepage = "https://kaypy.app"
Repository = "https://github.com/sfranz2422/kaypy"
Documentation = "https://kaypy.app/guide/"
Playground = "https://kaypy.app/play/"
Discord = "https://discord.gg/sVXnsDZNm"

[project.scripts]
kaypy = "kaypy.cli:main"

[tool.setuptools.packages.find]
include = ["kaypy*"]

[tool.setuptools.package-data]
# The page `kaypy web` builds from. It is data, not code, so it needs naming
# here or a wheel would install an engine that cannot export anything — and
# the failure would be at a student's machine, not at build time.
"kaypy" = ["web_page.html"]
# The starter game and its sprites ship inside the package, so `kaypy new
# mygame` produces something that runs without a checkout and without a
# network. The sounds do NOT: they are 2.6 MB against the engine's 92 KB, and
# only one lesson plays audio, so `kaypy new` fetches them (see kaypy/cli.py)
# and every install that never needs them stops paying for them.
"kaypy.starter" = ["*.py", "*.png", "*.md", "images/*", "dungeon/*"]

[tool.setuptools.exclude-package-data]
# Belt and braces. Narrowing package-data above is not enough on its own:
# include-package-data is on by default, so anything MANIFEST.in sweeps up
# lands in the wheel regardless of package-data. This is what actually keeps
# the sounds out, and it keeps them out even if a copy reappears under
# kaypy/starter/ one day.
"kaypy.starter" = ["sounds/*"]
