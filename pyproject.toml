[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaypy"
version = "0.1.1"
description = "A real-Python game engine with KAPLAY's component API, backed by pygame-ce, exporting to the browser."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stephen Franz" }]
keywords = ["game", "gamedev", "game-engine", "kaplay", "pygame", "education", "teaching", "wasm"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: pygame",
    "Operating System :: OS Independent",
]

dependencies = [
    # Pinned exact, not a floating >=, on purpose — see DEVELOPING.md, "Why
    # pygame-ce is pinned, not vendored". Bump deliberately, re-run tests/
    # and examples/, then move the pin.
    "pygame-ce==2.5.8",
]

[project.optional-dependencies]
# Only needed by `kaypy web` (the pygbag build), never at runtime.
# imageio-ffmpeg is the .wav->.ogg converter that step falls back to when
# ffmpeg isn't on PATH — its wheel bundles an actual static ffmpeg binary
# per-platform, so plain `pip install` is enough; no Homebrew or other
# system package manager needed.
web = ["pygbag>=0.9", "imageio-ffmpeg>=0.5"]

[project.urls]
Homepage = "https://github.com/sfranz2422/kaypy"
Repository = "https://github.com/sfranz2422/kaypy"
Documentation = "https://github.com/sfranz2422/kaypy/blob/main/GUIDE.md"

[project.scripts]
kaypy = "kaplay.cli:main"

[tool.setuptools.packages.find]
include = ["kaplay*"]

[tool.setuptools.package-data]
# The starter game and its sprites ship inside the package, so `kaypy new
# mygame` produces something that runs without a checkout and without a
# network. The sounds do NOT: they are 2.6 MB against the engine's 92 KB, and
# only one lesson plays audio, so `kaypy new` fetches them (see kaplay/cli.py)
# and every install that never needs them stops paying for them.
"kaplay.starter" = ["*.py", "*.png", "*.md", "images/*", "dungeon/*"]

[tool.setuptools.exclude-package-data]
# Belt and braces. Narrowing package-data above is not enough on its own:
# include-package-data is on by default, so anything MANIFEST.in sweeps up
# lands in the wheel regardless of package-data. This is what actually keeps
# the sounds out, and it keeps them out even if a copy reappears under
# kaplay/starter/ one day.
"kaplay.starter" = ["sounds/*"]
